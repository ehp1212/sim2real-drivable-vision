launch:
  headless: false
  renderer: RayTracedLighting

generation:
  num_frames: 5
  seed: 42
  output_dir: sdg/outputs/test_run
  rt_subframes: 8

environment:
  url: /Isaac/Environments/Simple_Warehouse/full_warehouse.usd
  semantic_labels:
    drivable:
      - /실제/바닥/Prim/경로
camera:
  resolution: [640, 384]
  focal_length: 24.0
  clipping_range: [0.05, 100.0]

  position:
    min: [-2.0, -2.0, 0.15]
    max: [2.0, 2.0, 0.30]

  look_at:
    min: [-1.0, 1.0, 0.0]
    max: [1.0, 4.0, 0.2]

randomization:
  lighting:
    enabled: false
    count: 3

    position:
      min: [-3.0, -3.0, 2.0]
      max: [3.0, 3.0, 4.0]

    intensity:
      min: 1500
      max: 5000

    color:
      min: [0.7, 0.7, 0.7]
      max: [1.0, 1.0, 1.0]

    temperature:
      mean: 5000
      std: 800

    scale:
      min: 0.5
      max: 1.5

  obstacles:
    obstacles:
    enabled: true

    assets:
      - name: cardboard_box
        url: /Isaac/Environments/Simple_Warehouse/Props/SM_CardBoxD_04.usd
        count: 4

      - name: traffic_cone
        url: /Isaac/Environments/Simple_Warehouse/Props/S_TrafficCone.usd
        count: 2

      - name: pallet
        url: /Isaac/Environments/Simple_Warehouse/Props/SM_PaletteA_01.usd
        count: 1

    position:
      min: [-2.0, 0.5, 0.0]
      max: [2.0, 4.0, 0.0]

    rotation:
      min: [0.0, 0.0, -180.0]
      max: [0.0, 0.0, 180.0]

    scale:
      min: [0.7, 0.7, 0.7]
      max: [1.3, 1.3, 1.3]

    color:
      min: [0.1, 0.1, 0.1]
      max: [0.9, 0.9, 0.9]

writer:
  rgb: true
  semantic_segmentation: true